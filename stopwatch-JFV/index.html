<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stopwatch</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Orbitron', monospace;
      font-variant-numeric: tabular-nums;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #f9f9f9;
    }

    .display {
      background-color: #e8ebff;
      border: 8px solid #333;
      border-radius: 40px;
      width: 600px;
      height: 220px;
      padding: 20px 40px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      color: #000;
      margin-bottom: 40px;
    }

    .main-time {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 5rem;
      line-height: 1;
      font-weight: 700;
    }

    .digit {
      display: inline-block;
      width: 1ch;           /* each digit takes fixed width */
      text-align: center;
    }

    .separator {
      display: inline-block;
      width: 0.8ch;
      text-align: center;
      transform: translateY(-3px);
    }

    .milliseconds {
      position: absolute;
      bottom: 25px;
      right: 60px;
      font-size: 2rem;
      opacity: 0.9;
      letter-spacing: 1px;
    }

    .buttons {
      display: flex;
      gap: 40px;
    }

    button {
      font-size: 2rem;
      font-weight: 500;
      padding: 20px 60px;
      border-radius: 20px;
      border: 6px solid #333;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.1s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    #startStop {
      background: linear-gradient(to bottom, #6eff6e, #4fda4f);
    }

    #clear {
      background: linear-gradient(to bottom, #ff5a5a, #e22d2d);
    }
  </style>
</head>
<body>
  <div class="display">
    <div class="main-time" id="time">
      <!-- Hours -->
      <span class="digit" id="h1">0</span>
      <span class="digit" id="h2">0</span>
      <span class="separator">:</span>

      <!-- Minutes -->
      <span class="digit" id="m1">0</span>
      <span class="digit" id="m2">0</span>
      <span class="separator">:</span>

      <!-- Seconds -->
      <span class="digit" id="s1">0</span>
      <span class="digit" id="s2">0</span>
    </div>
    <div class="milliseconds" id="milliseconds">000</div>
  </div>

  <div class="buttons">
    <button id="startStop">Start</button>
    <button id="clear">Clear</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
