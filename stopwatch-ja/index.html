<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    
    <style>
        body {
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .stopwatch-container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 72px;
            font-weight: bold;
            color: #222;
            background-color: #e0e8ff; /* Color azulado claro de la imagen */
            padding: 30px 40px;
            border-radius: 20px;
            border: 4px solid #333;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        /* Estilo para los milisegundos, más pequeños como en la imagen */
        .display #milliseconds {
            font-size: 24px;
            color: #555;
            vertical-align: text-bottom;
            margin-left: 8px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 25px; /* Espacio entre botones */
        }

        .btn {
            font-size: 28px;
            font-weight: bold;
            color: white;
            padding: 15px 50px;
            border: 4px solid #333;
            border-radius: 12px;
            cursor: pointer;
            min-width: 180px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        /* Botón Start (Verde) */
        .btn.start {
            background-color: #4CAF50;
        }

        /* Botón Pause (Naranja - para diferenciar de Clear) */
        .btn.pause {
            background-color: #ff9800;
        }

        /* Botón Clear (Rojo) */
        .btn.reset {
            background-color: #f44336;
        }
    </style>
</head>
<body>

    <div class="stopwatch-container">
        <div class="display">
            <span id="hours">00</span>:
            <span id="minutes">00</span>:
            <span id="seconds">00</span>
            <span id="milliseconds">000</span>
        </div>
        
        <div class="controls">
            <button id="startStopBtn" class="btn start">Start</button>
            <button id="resetBtn" class="btn reset">Clear</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
