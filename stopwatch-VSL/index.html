<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stopwatch & Countdown</title>
  <style>
    :root{
      --bg:#eef5ff;
      --rim:#222;
      --display-bg:#e7efff;
      --btn-green:#22c55e;
      --btn-green-dark:#16a34a;
      --btn-red:#ef4444;
      --btn-red-dark:#dc2626;
      --btn-gray:#64748b;
      --btn-gray-dark:#475569;
      --accent:#60a5fa;
      --focus:#1d4ed8;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,'Noto Sans',sans-serif;
      background:var(--bg);
      color:#111;
      display:grid;
      place-items:center;
    }
    .app{
      width:min(860px,94vw);
      padding:16px 18px 20px;
      border:4px solid var(--rim);
      border-radius:22px;
      background:#fff;
      box-shadow:0 10px 30px rgba(0,0,0,.12);
    }

    /* Mode toggle */
    .modes{
      display:flex;
      gap:8px;
      justify-content:center;
      margin-bottom:14px;
    }
    .mode-btn{
      appearance:none;
      border:3px solid var(--rim);
      background:#fff;
      font-weight:700;
      padding:8px 14px;
      border-radius:999px;
      cursor:pointer;
      transition:transform .06s ease;
    }
    .mode-btn[aria-pressed="true"]{
      background:var(--accent);
      border-color:var(--rim);
      color:#fff;
    }
    .mode-btn:focus-visible{
      outline:3px solid var(--focus);
      outline-offset:2px;
    }
    .mode-btn:active{transform:translateY(1px)}

    /* Display */
    .display-wrap{
      position:relative;
      border:4px solid var(--rim);
      border-radius:24px;
      padding:10px 14px;
      background:var(--display-bg);
    }
    .display{
      width:100%;
      text-align:center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      letter-spacing:.02em;
      color:#000;
      user-select:none;
      line-height:1;
    }
    .big{
      font-size: clamp(44px, 9vw, 92px);
      font-weight:800;
    }
    .millis{
      display:inline-block;
      font-size: clamp(14px, 2.6vw, 26px);
      vertical-align:top;
      padding-left:4px;
      transform: translateY(6%);
      opacity:.8;
    }
    .finished.flash{
      animation: flash 900ms steps(2, jump-none) 5;
    }
    @keyframes flash{
      0%,100%{background:var(--display-bg)}
      50%{background:#ffdcdc}
    }

    /* Controls row */
    .controls{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:14px;
    }
    .btn{
      appearance:none;
      border:4px solid var(--rim);
      border-radius:16px;
      padding:14px 16px;
      font-size:20px;
      font-weight:800;
      cursor:pointer;
      transition:filter .08s ease, transform .06s ease;
      color:#000;
    }
    .btn:focus-visible{
      outline:4px solid var(--focus);
      outline-offset:2px;
    }
    .btn:active{transform:translateY(1px)}
    .btn.green{background:var(--btn-green)}
    .btn.green:hover{filter:brightness(.96)}
    .btn.green:active{background:var(--btn-green-dark)}
    .btn.red{background:var(--btn-red)}
    .btn.red:hover{filter:brightness(.96)}
    .btn.red:active{background:var(--btn-red-dark)}
    .btn.gray{background:var(--btn-gray); color:#fff}
    .btn.gray:active{background:var(--btn-gray-dark)}

    /* Stopwatch extras */
    .row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:12px;
      align-items:center;
      justify-content:center;
    }
    .hint{
      font-size:12px;
      opacity:.7;
      text-align:center;
      margin-top:8px;
    }
    .laps{
      max-height:220px;
      overflow:auto;
      border:3px dashed #cbd5e1;
      border-radius:12px;
      padding:8px;
      background:#f8fafc;
      margin-top:12px;
    }
    .lap{
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      padding:8px 10px;
      background:#fff;
      border-radius:8px;
      border:2px solid #e2e8f0;
    }
    .lap + .lap{margin-top:6px}

    /* Countdown input & presets */
    .countdown-setup{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      align-items:center;
      justify-content:center;
      margin-top:12px;
    }
    .time-input{
      display:flex;
      align-items:center;
      gap:6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight:700;
      font-size:22px;
      border:3px solid var(--rim);
      border-radius:12px;
      background:#fff;
      padding:6px 10px;
    }
    .time-input input{
      width:2.7ch;
      font: inherit;
      border:none;
      outline:none;
      text-align:center;
      background:transparent;
    }
    .time-input input:focus{outline:2px solid var(--focus); border-radius:6px}
    .presets{
      display:flex; gap:8px; flex-wrap:wrap; justify-content:center;
    }
    .chip{
      padding:8px 10px;
      border:3px solid var(--rim);
      border-radius:999px;
      background:#fff;
      font-weight:700;
      cursor:pointer;
    }
    .sr-only{
      position:absolute !important;
      height:1px;width:1px;
      overflow:hidden;clip:rect(1px,1px,1px,1px);
      white-space:nowrap;border:0;padding:0;margin:-1px;
    }

    @media (max-width:520px){
      .controls{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <main class="app" aria-labelledby="title">
    <h1 id="title" class="sr-only">Stopwatch & Countdown Timer</h1>

    <div class="modes" role="tablist" aria-label="Modes">
      <button id="modeStopwatch" class="mode-btn" role="tab" aria-selected="true" aria-pressed="true">Stopwatch</button>
      <button id="modeCountdown" class="mode-btn" role="tab" aria-selected="false" aria-pressed="false">Countdown</button>
    </div>

    <section class="display-wrap" id="displayWrap">
      <div id="display" class="display big" role="timer" aria-live="polite" aria-atomic="true" aria-label="Timer display">
        00:00:00<span class="millis">000</span>
      </div>
    </section>

    <!-- Stopwatch controls -->
    <section id="stopwatchUI" aria-label="Stopwatch controls">
      <div class="controls" style="margin-top:16px">
        <button id="swStartPause" class="btn green" aria-label="Start (Space)">Start</button>
        <button id="swReset" class="btn red" aria-label="Reset (R)">Clear</button>
      </div>
      <div class="row">
        <button id="swLap" class="btn gray" aria-label="Add Lap (L)">Lap</button>
        <span class="hint">Shortcuts: Space = Start/Pause, L = Lap, R = Reset, M = Switch Mode</span>
      </div>
      <div id="laps" class="laps" aria-label="Lap times" aria-live="polite"></div>
    </section>

    <!-- Countdown controls -->
    <section id="countdownUI" aria-label="Countdown controls" hidden>
      <div class="countdown-setup">
        <label class="time-input" aria-label="Set hours minutes and seconds">
          <span class="sr-only">Hours</span>
          <input id="hh" inputmode="numeric" maxlength="2" aria-label="Hours" value="00">
          :
          <span class="sr-only">Minutes</span>
          <input id="mm" inputmode="numeric" maxlength="2" aria-label="Minutes" value="08">
          :
          <span class="sr-only">Seconds</span>
          <input id="ss" inputmode="numeric" maxlength="2" aria-label="Seconds" value="00">
        </label>
        <div class="presets" aria-label="Preset times">
          <button class="chip" data-preset="30">30s</button>
          <button class="chip" data-preset="60">1m</button>
          <button class="chip" data-preset="300">5m</button>
        </div>
      </div>
      <div class="controls">
        <button id="cdStartPause" class="btn green" aria-label="Start (Space)">Start</button>
        <button id="cdReset" class="btn red" aria-label="Reset (R)">Clear</button>
      </div>
      <p class="hint">When finished: screen flashes and a short beep plays. Shortcuts: Space = Start/Pause, R = Reset, M = Switch Mode</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
