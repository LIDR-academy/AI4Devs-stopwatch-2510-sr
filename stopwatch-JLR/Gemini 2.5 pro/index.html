<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch & Countdown</title>
    <style>
        /* Estilos generales */
        :root {
            --color-green: #4CAF50; /* Verde para Iniciar/Set */
            --color-green-dark: #45a049;
            --color-red: #f44336;   /* Rojo para Pausar/Clear */
            --color-red-dark: #da190b;
            --color-gray: #757575;  /* Gris para Volver/Teclas */
            --color-gray-dark: #616161;
            --display-bg: #e0e4ff; /* Fondo de la pantalla digital */
            --body-bg: #333;       /* Fondo de la app */
            --watch-bg: #f5f5f5;   /* Cuerpo del "reloj" */
            --text-dark: #000;
            --text-light: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            Helvetica, Arial, sans-serif;
            background-color: var(--body-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-dark);
            user-select: none; /* Evitar selección de texto */
        }

        /* Contenedor principal del "Smartwatch" */
        .smartwatch-body {
            background-color: var(--watch-bg);
            border: 6px solid #000;
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            box-sizing: border-box; /* Asegura que el padding no afecte el width total */
        }

        /* Ocultar pantallas que no están activas */
        .screen.hidden {
            display: none;
        }

        /* Estilo de la pantalla digital */
        .display {
            background-color: var(--display-bg);
            border: 3px solid #555;
            border-radius: 12px;
            padding: 20px 15px;
            font-family: "Courier New", Courier, monospace;
            font-size: 3.2rem; /* Tamaño grande para HH:MM:SS */
            font-weight: bold;
            text-align: right;
            margin-bottom: 20px;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden; /* Para que las centésimas no se salgan */
        }

        /* Estilo para las centésimas */
        .display .centiseconds {
            font-size: 1.5rem; /* Más pequeñas */
            opacity: 0.8;
            position: absolute;
            bottom: 12px;
            right: 15px;
        }

        /* Contenedor de botones de control (Iniciar, Pausar, etc) */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Dos columnas */
            gap: 15px;
            margin-bottom: 15px;
        }

        /* Estilo base de los botones */
        .btn {
            padding: 18px;
            font-size: 1.2rem;
            font-weight: bold;
            border: 2px solid #222;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            color: var(--text-light);
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: translateY(2px); /* Efecto de pulsación */
            box-shadow: 0 2px 3px rgba(0,0,0,0.1);
        }

        /* Colores de botones */
        .btn.green { background-color: var(--color-green); }
        .btn.green:hover { background-color: var(--color-green-dark); }

        .btn.red { background-color: var(--color-red); }
        .btn.red:hover { background-color: var(--color-red-dark); }

        .btn.gray {
            background-color: var(--color-gray);
            width: 100%; /* El botón "Volver" ocupa todo el ancho */
        }
        .btn.gray:hover { background-color: var(--color-gray-dark); }

        /* Menú Principal */
        #main-menu .btn {
            width: 100%;
            padding: 25px;
            font-size: 1.5rem;
        }
        #main-menu .btn:first-child {
            margin-bottom: 15px;
        }

        /* Teclado numérico (Countdown Input) */
        .keypad {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr; /* Tres columnas */
            gap: 12px;
            margin-bottom: 15px;
        }

        .keypad .btn {
            background-color: var(--color-gray);
            font-size: 1.8rem;
            padding: 20px 0; /* Más alto */
        }
        .keypad .btn:hover { background-color: var(--color-gray-dark); }

        /* Botones de Clear y Set en el teclado */
        .keypad-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

    </style>
</head>
<body>

<!-- Cuerpo principal del "Reloj" -->
<div class="smartwatch-body">

    <!-- Pantalla: Menú Principal -->
    <div id="main-menu" class="screen">
        <button id="btn-goto-stopwatch" class="btn green">Cronómetro</button>
        <button id="btn-goto-countdown" class="btn gray">Cuenta Atrás</button>
    </div>

    <!-- Pantalla: Cronómetro -->
    <div id="stopwatch-screen" class="screen hidden">
        <div id="stopwatch-display" class="display">
            00:00:00<span class="centiseconds">00</span>
        </div>
        <div class="controls">
            <button id="sw-start-pause" class="btn green">Iniciar</button>
            <button id="sw-reset" class="btn red">Reiniciar</button>
        </div>
        <button class="btn gray back-btn">Volver</button>
    </div>

    <!-- Pantalla: Input Cuenta Atrás -->
    <div id="countdown-input-screen" class="screen hidden">
        <div id="cd-input-display" class="display">00:00:00</div>
        <div class="keypad">
            <button class="btn num-btn">1</button>
            <button class="btn num-btn">2</button>
            <button class="btn num-btn">3</button>
            <button class="btn num-btn">4</button>
            <button class="btn num-btn">5</button>
            <button class="btn num-btn">6</button>
            <button class="btn num-btn">7</button>
            <button class="btn num-btn">8</button>
            <button class="btn num-btn">9</button>
            <!-- Botón 0 centrado o en otra posición -->
            <button class="btn num-btn" style="grid-column: 2 / 3;">0</button>
        </div>
        <div class="keypad-controls">
            <button id="cd-clear" class="btn red">Clear</button>
            <button id="cd-set" class="btn green">Set</button>
        </div>
        <button class="btn gray back-btn">Volver</button>
    </div>

    <!-- Pantalla: Ejecución Cuenta Atrás -->
    <div id="countdown-run-screen" class="screen hidden">
        <div id="cd-run-display" class="display">
            00:00:00<span class="centiseconds">00</span>
        </div>
        <div class="controls">
            <button id="cd-start-pause" class="btn green">Iniciar</button>
            <button id="cd-reset" class="btn red">Reiniciar</button>
        </div>
        <button class="btn gray back-btn">Volver</button>
    </div>

</div>
<!-- Fin de .smartwatch-body -->

<script src="script.js"></script>
</body>
</html>
