<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Countdown</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- scripts unchanged / functionality preserved -->
  <script defer src="shared.js"></script>
  <script defer src="countdown.js"></script>
</head>
<body class="bg-white min-h-screen flex flex-col">
  <main class="w-full max-w-[1500px] mx-auto px-3 sm:px-6 pt-6 pb-28 grow">

    <!-- DISPLAY (same as stopwatch styling) -->
    <div class="w-full mb-8">
      <div class="w-full bg-indigo-50 border-[14px] border-black rounded-[3rem] shadow-sm px-6 sm:px-10 py-6 sm:py-8 flex items-center justify-center">
        <div class="flex items-end justify-center space-x-3 sm:space-x-5">
          <span id="cd-hours" class="text-6xl sm:text-8xl md:text-9xl font-semibold leading-none tabular-nums text-black">00</span>
          <span class="text-6xl sm:text-8xl md:text-9xl font-semibold leading-none text-black">:</span>
          <span id="cd-minutes" class="text-6xl sm:text-8xl md:text-9xl font-semibold leading-none tabular-nums text-black">00</span>
          <span class="text-6xl sm:text-8xl md:text-9xl font-semibold leading-none text-black">:</span>
          <span class="relative inline-block">
            <span id="cd-seconds" class="block text-6xl sm:text-8xl md:text-9xl font-semibold leading-none tabular-nums text-black">00</span>
            <!-- mmm absolutely positioned; equal spacing to SS and box bottom -->
            <span id="cd-milliseconds"
              class="absolute left-1/2 -translate-x-1/2 top-full translate-y-[2px] text-2xl sm:text-3xl md:text-4xl font-semibold leading-tight tabular-nums text-black">
              000
            </span>
          </span>
        </div>
      </div>
    </div>

    <!-- KEYPAD (tight grid; neon green; thick black borders; Set & Clear same size as digits) -->
    <section id="cd-keypad" class="space-y-5">
      <!-- Row 1: 5 6 7 8 9 | Set -->
      <div class="grid grid-cols-6 gap-4 sm:gap-5">
        <button data-digit="5" class="w-full py-5 rounded-3xl border-[10px] border-black text-black text-4xl font-semibold shadow
               bg-gradient-to-b from-[#2bff63] to-[#13cc3c]">5</button>
        <button data-digit="6" class="w-full py-5 rounded-3xl border-[10px] border-black text-black text-4xl font-semibold shadow
               bg-gradient-to-b from-[#2bff63] to-[#13cc3c]">6</button>
        <button data-digit="7" class="w-full py-5 rounded-3xl border-[10px] border-black text-black text-4xl font-semibold shadow
               bg-gradient-to-b from-[#2bff63] to-[#13cc3c]">7</button>
        <button data-digit="8" class="w-full py-5 rounded-3xl border-[10px] border-black text-black text-4xl font-semibold shadow
               bg-gradient-to-b from-[#2bff63] to-[#13cc3c]">8</button>
        <button data-digit="9" class="w-full py-5 rounded-3xl border-[10px] border-black text-black text-4xl font-semibold shadow
               bg-gradient-to-b from-[#2bff63] to-[#13cc3c]">9</button>
        <button id="cd-set" class="w-full py-5 rounded-3xl border-[10px] border-black text-black text-4xl font-semibold shadow
               bg-gradient-to-b from-[#2bff63] to-[#13cc3c]">Set</button>
      </div>

      <!-- Row 2: 0 1 2 3 4 | Clear -->
      <div class="grid grid-cols-6 gap-4 sm:gap-5">
        <button data-digit="0" class="w-full py-5 rounded-3xl border-[10px] border-black text-black text-4xl font-semibold shadow
               bg-gradient-to-b from-[#2bff63] to-[#13cc3c]">0</button>
        <button data-digit="1" class="w-full py-5 rounded-3xl border-[10px] border-black text-black text-4xl font-semibold shadow
               bg-gradient-to-b from-[#2bff63] to-[#13cc3c]">1</button>
        <button data-digit="2" class="w-full py-5 rounded-3xl border-[10px] border-black text-black text-4xl font-semibold shadow
               bg-gradient-to-b from-[#2bff63] to-[#13cc3c]">2</button>
        <button data-digit="3" class="w-full py-5 rounded-3xl border-[10px] border-black text-black text-4xl font-semibold shadow
               bg-gradient-to-b from-[#2bff63] to-[#13cc3c]">3</button>
        <button data-digit="4" class="w-full py-5 rounded-3xl border-[10px] border-black text-black text-4xl font-semibold shadow
               bg-gradient-to-b from-[#2bff63] to-[#13cc3c]">4</button>
        <!-- Metallic gray CLEAR (gradient) -->
        <button id="cd-keypad-clear" class="w-full py-5 rounded-3xl border-[10px] border-black text-black text-4xl font-semibold shadow
               bg-gradient-to-b from-gray-100 via-gray-300 to-gray-500">Clear</button>
      </div>
    </section>

    <!-- RUN MODE BUTTONS (same behavior; visuals keep thick black borders) -->
    <section id="cd-run" class="hidden w-full mt-6">
      <div class="w-full flex flex-col sm:flex-row sm:space-x-8 space-y-6 sm:space-y-0">
        <button id="cd-left" type="button"
                class="w-full py-6 rounded-[2.5rem] border-[12px] border-black bg-green-500 hover:bg-green-600 text-white text-4xl font-semibold shadow">
          Start
        </button>
        <button id="cd-right" type="button"
                class="w-full py-6 rounded-[2.5rem] border-[12px] border-black bg-red-500 hover:bg-red-600 text-white text-4xl font-semibold shadow">
          Clear
        </button>
      </div>
    </section>
  </main>

  <!-- BACK BAR (deep blue with green arrow, like the mock) -->
  <a href="home.html" class="block w-full bg-blue-900 text-white py-4 text-2xl sm:text-3xl font-semibold text-left px-6">
    <span class="inline-block text-green-400 pr-3">◀</span> Back
  </a>
</body>
</html>
