<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Timer — Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen">
  <main class="max-w-[1400px] mx-auto h-screen md:h-[92vh] px-3 sm:px-6 py-6">
    <!-- Outer frame -->
    <div class="grid grid-cols-1 md:grid-cols-2 h-full rounded-3xl overflow-hidden border-[8px] border-slate-200">

      <!-- LEFT: Stopwatch (white) -->
      <a href="stopwatch.html"
         class="relative flex flex-col items-center justify-center bg-white p-6 md:border-r-[8px] md:border-slate-200">
        <h2 class="text-4xl sm:text-5xl font-semibold mb-6 text-slate-900">Stopwatch</h2>

        <!-- Thick outlined GREEN UP ARROW (SVG) -->
        <svg class="w-48 h-48 sm:w-64 sm:h-64"
             viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg"
             aria-hidden="true">
          <path d="M128 24 L36 128 H88 V232 H168 V128 H220 Z"
                fill="#22c55e" stroke="#111827" stroke-width="18" stroke-linejoin="round"/>
        </svg>
      </a>

      <!-- RIGHT: Countdown (pale green) -->
      <a href="countdown.html"
         class="relative flex flex-col items-center justify-center bg-green-50 p-6">
        <h2 class="text-4xl sm:text-5xl font-semibold mb-6 text-slate-900">Countdown</h2>

        <!-- Thick outlined RED DOWN ARROW (SVG) -->
        <svg class="w-48 h-48 sm:w-64 sm:h-64"
             viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg"
             aria-hidden="true">
          <path d="M128 232 L220 128 H168 V24 H88 V128 H36 Z"
                fill="#ef4444" stroke="#111827" stroke-width="18" stroke-linejoin="round"/>
        </svg>
      </a>
    </div>
  </main>
</body>
</html>
