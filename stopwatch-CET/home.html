<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Timer — Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <main class="max-w-6xl mx-auto px-4 py-10">
    <h1 class="text-3xl sm:text-4xl font-bold text-center mb-8">Choose a Mode</h1>

    <!-- Panels -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Stopwatch -->
      <a href="stopwatch.html"
         class="group rounded-3xl border-[6px] border-slate-700 bg-white p-8 flex flex-col items-center justify-center shadow hover:shadow-lg transition">
        <div class="text-3xl sm:text-4xl font-semibold mb-6">Stopwatch</div>
        <div class="text-[6rem] leading-none select-none">⬆️</div>
      </a>

      <!-- Countdown -->
      <a href="countdown.html"
         class="group rounded-3xl border-[6px] border-slate-700 bg-green-50 p-8 flex flex-col items-center justify-center shadow hover:shadow-lg transition">
        <div class="text-3xl sm:text-4xl font-semibold mb-6">Countdown</div>
        <div class="text-[6rem] leading-none select-none">⬇️</div>
      </a>
    </div>
  </main>
</body>
</html>
