<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stopwatch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Main stopwatch logic -->
  <script src="script.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-5xl px-4 py-10">
    <!-- Stopwatch display -->
    <div class="w-full mb-10">
      <div
        class="w-full bg-indigo-50 border-[14px] border-gray-700 rounded-[3rem] shadow-md px-6 sm:px-10 py-6 sm:py-8 flex items-center justify-center"
      >
        <div class="flex items-end justify-center space-x-3 sm:space-x-5">
          <span
            id="hours"
            class="text-5xl sm:text-7xl md:text-8xl font-semibold leading-none tabular-nums"
          >
            00
          </span>
          <span
            class="text-5xl sm:text-7xl md:text-8xl font-semibold leading-none"
          >
            :
          </span>
          <span
            id="minutes"
            class="text-5xl sm:text-7xl md:text-8xl font-semibold leading-none tabular-nums"
          >
            00
          </span>
          <span
            class="text-5xl sm:text-7xl md:text-8xl font-semibold leading-none"
          >
            :
          </span>

          <!-- Seconds with milliseconds absolutely positioned underneath -->
          <span class="relative inline-block">
            <span
              id="seconds"
              class="block text-5xl sm:text-7xl md:text-8xl font-semibold leading-none tabular-nums"
            >
              00
            </span>
            <span
              id="milliseconds"
              class="absolute left-1/2 -translate-x-1/2 top-full translate-y-[2px] text-xl sm:text-2xl md:text-3xl font-semibold leading-tight tabular-nums"
            >
              000
            </span>
          </span>
        </div>
      </div>
    </div>

    <!-- Buttons row -->
    <div class="w-full flex flex-col sm:flex-row sm:space-x-8 space-y-6 sm:space-y-0">
      <!-- Left button: Start / Pause / Continue -->
      <button
        id="leftButton"
        type="button"
        class="w-full py-5 sm:py-6 rounded-[2.5rem] border-[10px] border-gray-700 bg-green-500 hover:bg-green-600 text-white text-3xl sm:text-4xl font-semibold shadow-md transition-colors duration-150"
      >
        Start
      </button>

      <!-- Right button: Clear -->
      <button
        id="rightButton"
        type="button"
        class="w-full py-5 sm:py-6 rounded-[2.5rem] border-[10px] border-gray-700 bg-red-500 hover:bg-red-600 text-white text-3xl sm:text-4xl font-semibold shadow-md transition-colors duration-150"
      >
        Clear
      </button>
    </div>
  </div>
</body>
</html>
