<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stopewatch</title>
    <meta name="description" content="Stopwatch y Countdown." />
    <style>
      :root {
        --bg: #0b3a53;
        --card: #0f4f6a;
        --card-hover: #126487;
        --text: #ffffff;
        --accent: #20c997;
        --accent-contrast: #093a2d;

        --display-bg: #0b2f41;
        --display-border: #0a2c3d;
        --green: #1ec44d;
        --red: #e53935;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans";
        color: var(--text);
        background: radial-gradient(1200px 600px at 30% -10%, #166086 0%, var(--bg) 60%);
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-height: 100dvh;
      }

      header, footer { padding: 1rem clamp(1rem, 3vw, 2rem); }
      header { display: flex; align-items: center; justify-content: space-between; }
      header h1 { margin: 0; font-size: clamp(1.25rem, 2.4vw, 1.75rem); letter-spacing: .5px; }

      nav[aria-label="primary"] { display: flex; gap: .5rem; }

      main { display: grid; place-items: center; padding: clamp(1rem, 3vw, 2rem); }
      .grid {
        width: min(1100px, 92vw);
        display: grid;
        grid-template-columns: repeat(2, minmax(240px, 1fr));
        gap: clamp(1rem, 3vw, 2rem);
      }

      .card {
        background: linear-gradient(180deg, var(--card) 0%, #0e3f57 100%);
        border: 1px solid #0a2c3d;
        border-radius: 18px;
        padding: clamp(1rem, 2.5vw, 2rem);
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: .5rem;
        box-shadow: 0 10px 30px rgba(0,0,0,.25);
        transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
      }
      .card h2 { margin: 0 0 .25rem 0; font-size: clamp(1.25rem, 2.2vw, 1.6rem); }
      .card p { opacity: .9; margin: 0 0 .75rem 0; line-height: 1.35; }
      .card:hover { transform: translateY(-2px); background: linear-gradient(180deg, var(--card-hover) 0%, #0e3f57 100%); }
      .card:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

      .btn {
        appearance: none; border: 0; border-radius: 999px;
        padding: .9rem 1.25rem; font-weight: 700; font-size: 1rem; cursor: pointer;
        color: var(--accent-contrast);
        background: linear-gradient(180deg, #28e0ad 0%, var(--accent) 100%);
        box-shadow: 0 6px 16px rgba(0,0,0,.25);
      }
      .btn:focus-visible { outline: 3px solid #b6ffe7; outline-offset: 2px; }
      .btn.secondary { background: #143e52; color: var(--text); border: 1px solid #0b2c3d; }
      .btn.danger { background: linear-gradient(180deg, #ff7c7a 0%, var(--red) 100%); color: #2a0a0a; }
      .btn.success { background: linear-gradient(180deg, #5df59b 0%, var(--green) 100%); color: #062612; }

      .view { display: none; width: min(1100px, 92vw); }
      .view.active { display: block; }
      .backbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }

      /* DISPLAY del reloj (Stopwatch y Countdown comparten estilos) */
      .clock {
        position: relative;
        user-select: none;
        background: var(--display-bg);
        border: 2px solid var(--display-border);
        border-radius: 16px;
        padding: 1.2rem 1.2rem 1.8rem;
        display: grid;
        place-items: center;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 12px 30px rgba(0,0,0,.25);
      }
      .clock__main {
        font-variant-numeric: tabular-nums;
        letter-spacing: 2px;
        font-size: clamp(2.2rem, 7vw, 3.8rem);
      }
      .clock__ms {
        position: absolute;
        right: .9rem; bottom: .5rem;
        font-variant-numeric: tabular-nums;
        font-size: clamp(.8rem, 2vw, 1rem);
        opacity: .9;
      }

      .stack { display: grid; gap: .9rem; }
      .row { display: flex; gap: .75rem; flex-wrap: wrap; }

      /* Teclado numérico */
      .keypad {
        display: grid;
        grid-template-columns: repeat(3, minmax(70px, 1fr));
        gap: .6rem;
      }
      .keypad .btn { padding: 1rem 1rem; font-size: 1.25rem; }

      .hidden { display: none !important; }

      footer { opacity: .8; font-size: .9rem; text-align: center; }

      @media (prefers-reduced-motion: reduce) {
        .card, .btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 aria-label="stopewatch">⏱️ stopewatch</h1>
      <nav aria-label="primary">
        <button class="btn secondary" data-link="#/">Inicio</button>
        <button class="btn secondary" data-link="#/stopwatch">Stopwatch</button>
        <button class="btn secondary" data-link="#/countdown">Countdown</button>
      </nav>
    </header>

    <main id="app" tabindex="-1">
      <!-- Landing -->
      <section id="view-home" class="view active" aria-labelledby="home-title">
        <div class="grid" role="list" aria-describedby="home-title">
          <h2 id="home-title" style="grid-column:1/-1;margin:.25rem 0 0 0;">Elige una herramienta</h2>

          <article class="card" role="listitem">
            <h2>Stopwatch</h2>
            <p>Cronómetro hacia arriba con <strong>Start / Stop / Continue</strong> y <strong>Clear</strong>.</p>
            <div><button class="btn" data-link="#/stopwatch">Ir a Stopwatch</button></div>
          </article>

          <article class="card" role="listitem">
            <h2>Countdown</h2>
            <p>Cuenta regresiva con teclado numérico, <strong>Set</strong> y <strong>Clear</strong>.</p>
            <div><button class="btn" data-link="#/countdown">Ir a Countdown</button></div>
          </article>
        </div>
      </section>

      <!-- Stopwatch -->
      <section id="view-stopwatch" class="view" aria-labelledby="sw-title">
        <div class="backbar">
          <button class="btn secondary" data-link="#/">← Back</button>
          <h2 id="sw-title" style="margin:0">Stopwatch</h2>
          <span aria-hidden="true"></span>
        </div>

        <div class="stack">
          <div class="clock" role="timer" aria-live="polite" aria-atomic="true">
            <div id="sw-main" class="clock__main" aria-label="tiempo hh:mm:ss">00:00:00</div>
            <div id="sw-ms" class="clock__ms" aria-label="milisegundos">000</div>
          </div>

          <div class="row">
            <button id="sw-toggle" class="btn success" type="button">Start</button>
            <button id="sw-clear" class="btn danger" type="button">Clear</button>
          </div>
        </div>
      </section>

      <!-- Countdown -->
      <section id="view-countdown" class="view" aria-labelledby="cd-title">
        <div class="backbar">
          <button class="btn secondary" data-link="#/">← Back</button>
          <h2 id="cd-title" style="margin:0">Countdown</h2>
          <span aria-hidden="true"></span>
        </div>

        <div class="stack">
          <div class="clock" role="timer" aria-live="polite" aria-atomic="true">
            <div id="cd-main" class="clock__main" aria-label="tiempo hh:mm:ss">00:00:00</div>
            <div id="cd-ms" class="clock__ms" aria-label="milisegundos">000</div>
          </div>

          <!-- Controles previos a Set -->
          <div id="cd-setup" class="stack">
            <div class="keypad" role="group" aria-label="teclado numérico">
              <button class="btn" data-key="1">1</button>
              <button class="btn" data-key="2">2</button>
              <button class="btn" data-key="3">3</button>
              <button class="btn" data-key="4">4</button>
              <button class="btn" data-key="5">5</button>
              <button class="btn" data-key="6">6</button>
              <button class="btn" data-key="7">7</button>
              <button class="btn" data-key="8">8</button>
              <button class="btn" data-key="9">9</button>
              <div></div>
              <button class="btn" data-key="0">0</button>
              <div></div>
            </div>
            <div class="row">
              <button id="cd-set" class="btn success" type="button">Set</button>
              <button id="cd-clear1" class="btn danger" type="button">Clear</button>
            </div>
          </div>

          <!-- Controles tras Set -->
          <div id="cd-run" class="row hidden" aria-hidden="true">
            <button id="cd-toggle" class="btn" type="button">Stop</button>
            <button id="cd-clear2" class="btn danger" type="button">Clear</button>
          </div>
        </div>
      </section>
    </main>

    <footer><small>&nbsp;</small></footer>

    <!-- Recuerda: NO type="module" para file:// -->
    <script src="./script.js"></script>
  </body>
</html>
