<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timer and Countdown</title>

  <!-- Inline styles just for this prototype. In a real app,
       these would live in styles.css -->
  <style>
    :root {
      --blue: #0046af;
      --blue-dark: #013463;
      --green: #32e062;
      --red: #ff3b3b;
      --page-bg: #f5f7fb;
      --card-radius: 12px;
      --shadow-soft: 0 6px 18px rgba(0, 0, 0, 0.12);
      --transition-fast: 0.2s ease-out;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--page-bg);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      color: #111827;
    }

    header.top-banner {
      background: linear-gradient(90deg, var(--blue-dark), var(--blue));
      color: #e5f2ff;
      padding: 0.85rem 1.5rem;
      text-align: center;
      font-size: 0.95rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    header.top-banner p span {
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem 2.5rem;
      gap: 1.5rem;
    }

    h1.page-title {
      font-size: 1.8rem;
      letter-spacing: 0.03em;
      color: #0f172a;
      text-align: center;
    }

    .brand-strip {
      background: var(--blue);
      color: #eff6ff;
      padding: 0.8rem 1rem;
      width: 100%;
      max-width: 980px;
      text-align: center;
      border-radius: 999px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.2);
    }

    .mode-selector {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.5rem;
      margin-top: 0.5rem;
    }

    .mode-card {
      position: relative;
      border: none;
      border-radius: var(--card-radius);
      background: #ffffff;
      padding: 1.75rem 1rem 2.5rem;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      cursor: pointer;
      transition: transform var(--transition-fast),
        box-shadow var(--transition-fast),
        background var(--transition-fast);
    }

    .mode-card:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    .mode-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.25);
    }

    .mode-title {
      font-size: 1.5rem;
      letter-spacing: 0.04em;
    }

    .mode-card.stopwatch .mode-title {
      color: #047857;
    }

    .mode-card.countdown .mode-title {
      color: #b91c1c;
    }

    .arrow {
      width: 0;
      height: 0;
      border-left: 80px solid transparent;
      border-right: 80px solid transparent;
    }

    .arrow-up {
      border-bottom: 120px solid var(--green);
    }

    .arrow-down {
      border-top: 120px solid var(--red);
    }

    .mode-label-strip {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.45rem 0.75rem;
      text-align: center;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #e5e7eb;
      background: linear-gradient(90deg, #1e293b, #0f172a);
      border-radius: 0 0 var(--card-radius) var(--card-radius);
    }

    @media (max-width: 720px) {
      .mode-selector {
        grid-template-columns: minmax(0, 1fr);
      }

      .brand-strip {
        border-radius: 16px;
        font-size: 0.8rem;
        line-height: 1.4;
      }
    }
  </style>
</head>
<body>
  <header class="top-banner">
    <p>
      Everybody needs a stopwatch or a timer at some point — and there’s never one around!
      <span>Now you have one online.</span>
    </p>
  </header>

  <main>
    <h1 class="page-title">Timer &amp; Countdown</h1>

    <div class="brand-strip">
      timer-and-countdown.example
    </div>

    <section class="mode-selector" aria-label="Choose timer mode">
      <button
        id="stopwatch-card"
        class="mode-card stopwatch"
        type="button"
        aria-label="Open Stopwatch"
      >
        <h2 class="mode-title">Stopwatch</h2>
        <div class="arrow arrow-up" aria-hidden="true"></div>
        <div class="mode-label-strip">Click to open Stopwatch</div>
      </button>

      <button
        id="countdown-card"
        class="mode-card countdown"
        type="button"
        aria-label="Open Countdown"
      >
        <h2 class="mode-title">Countdown</h2>
        <div class="arrow arrow-down" aria-hidden="true"></div>
        <div class="mode-label-strip">Click to open Countdown</div>
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
